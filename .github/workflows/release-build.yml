name: Build and Attach Artifacts on Release

on:
  release:
    types: [published]

permissions:
  contents: write  # Required to upload assets to the release

jobs:
  build:
    runs-on: macos-latest  # macOS is required for iOS local builds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      # --- ANDROID APK ---
      - name: Build Android APK (local)
        run: |
          eas build --local \
            --platform android \
            --profile preview \
            --non-interactive \
            --output=./techflip-android.apk

      - name: Upload Android APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./techflip-android.apk
          asset_name: techflip-android.apk
          asset_content_type: application/vnd.android.package-archive

      # --- iOS IPA ---
      - name: Build iOS IPA (local)
        run: |
          eas build --local \
            --platform ios \
            --profile preview \
            --non-interactive \
            --output=./techflip-ios.ipa

      - name: Upload iOS IPA to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./techflip-ios.ipa
          asset_name: techflip-ios.ipa
          asset_content_type: application/octet-stream